name: Deploy to GitHub Pages

# El link público ahora lo publica la rama main (página "Próximamente"),
# así que aquí quitamos el push automático: landing-v1 sigue siendo la rama
# de trabajo del sitio real, y no queremos que cada commit en curso
# sobreescriba lo que ya está publicado. Para ver un build de este branch
# en GitHub Pages, lanzar este workflow manualmente (workflow_dispatch).
# Cuando el sitio real esté listo, mergear a main y restaurar el trigger de
# push aquí (o moverlo a main con el build completo).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
