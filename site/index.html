<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clappy — Próximamente</title>
  <meta name="description" content="Estamos construyendo algo nuevo. Vuelve pronto." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand: #532CE1;
      --brand-dark: #3D1FA8;
      --accent: #F5F102;
      --ink: #0D0B14;
      --lilac: #EDE6FF;
      --canvas: #F6F5F7;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: 'Sora', ui-sans-serif, system-ui, sans-serif;
      background: radial-gradient(circle at 50% -10%, var(--lilac) 0%, var(--canvas) 55%, var(--canvas) 100%);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
    }

    .glow {
      position: fixed;
      top: -220px;
      left: 50%;
      transform: translateX(-50%);
      width: 640px;
      height: 640px;
      background: radial-gradient(circle, rgba(83, 44, 225, 0.22) 0%, rgba(83, 44, 225, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 560px;
      width: 100%;
    }

    .logo {
      height: 42px;
      width: auto;
      margin-bottom: 56px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 50px;
      background: #fff;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--brand-dark);
      margin-bottom: 28px;
    }

    .badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(245, 241, 2, 0.35);
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      line-height: 1.05;
      font-weight: 700;
      margin: 0 0 18px;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: var(--brand);
    }

    p.lede {
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.6;
      color: #555;
      margin: 0 0 40px;
      max-width: 440px;
    }

    footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: #ACA8B5;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <main class="card">
    <img class="logo" src="assets/logotipo-dark.png" alt="Clappy" />
    <span class="badge"><span class="dot"></span>En construcción</span>
    <h1>Algo nuevo está<br /><span>por llegar</span>.</h1>
    <p class="lede">Estamos terminando de construir nuestra página. Muy pronto vas a poder conocer todo lo que estamos preparando.</p>
  </main>
  <footer>© 2026 Clappy</footer>
</body>
</html>
